<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MinutaTech P.H. — Plataforma de Control de Accesos, Portería Digital y Gobernanza Residencial">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0d1422"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="28%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <pattern id="archGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Surface -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="18" fill="url(#archGrid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#topGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="17.25" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="80" y="0" width="1040" height="2" fill="url(#topRule)"/>

  <!-- Left Content: Brand & Positioning -->
  <g transform="translate(72, 64)">
    <!-- Shield Emblem -->
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.5"/>
    <path d="M26 11 L39 16 V26 C39 34.5 33.4 40.8 26 43 C18.6 40.8 13 34.5 13 26 V16 Z" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
    <path d="M21 26.5 L24.5 30 L31.5 22.5" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wordmark -->
    <text x="68" y="30" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">MINUTATECH</text>
    <rect x="260" y="10" width="44" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="282" y="26" text-anchor="middle" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">P.H.</text>
    <text x="68" y="48" fill="#64748b" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">PHYSICAL SECURITY &amp; CONDOMINIUM OPERATIONS</text>

    <!-- Main Headline -->
    <text x="0" y="106" fill="#f1f5f9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.4">Control de Accesos, Minuta Digital y Gobernanza P.H.</text>
    <text x="0" y="138" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Plataforma full-stack offline-first para puestos de vigilancia 24/7, custodia</text>
    <text x="0" y="160" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">criptográfica de encomiendas, asambleas ponderadas y autogestión residencial.</text>

    <!-- Engineering Badges -->
    <g transform="translate(0, 194)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="148" height="30" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="15" cy="15" r="3.5" fill="#34d399"/>
      <text x="26" y="19" fill="#e2e8f0">PWA Offline-First</text>

      <rect x="158" y="0" width="166" height="30" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="173" cy="15" r="3.5" fill="#38bdf8"/>
      <text x="184" y="19" fill="#e2e8f0">PIN Bcrypt Custodia</text>

      <rect x="334" y="0" width="154" height="30" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="349" cy="15" r="3.5" fill="#f59e0b"/>
      <text x="360" y="19" fill="#e2e8f0">FIFO Mutex Store</text>

      <rect x="498" y="0" width="156" height="30" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="513" cy="15" r="3.5" fill="#a78bfa"/>
      <text x="524" y="19" fill="#e2e8f0">109 Passing Tests</text>
    </g>
  </g>

  <!-- Right Content: Telemetry Console Wireframe Card -->
  <g transform="translate(792, 54)">
    <rect x="0" y="0" width="340" height="252" rx="14" fill="#0b101b" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Window Topbar -->
    <rect x="0" y="0" width="340" height="38" rx="14" fill="#0f172a"/>
    <rect x="0" y="24" width="340" height="14" fill="#0f172a"/>
    <line x1="0" y1="38" x2="340" y2="38" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="19" r="4" fill="#334155"/>
    <circle cx="32" cy="19" r="4" fill="#334155"/>
    <circle cx="46" cy="19" r="4" fill="#334155"/>
    <text x="322" y="23" text-anchor="end" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">TURNO ACTIVO • UTC-5</text>

    <!-- Metric Row -->
    <g transform="translate(18, 54)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <rect x="0" y="0" width="94" height="58" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="20" fill="#64748b" font-size="10" font-weight="600">EN CONJUNTO</text>
      <text x="12" y="44" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">14</text>

      <rect x="105" y="0" width="94" height="58" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="117" y="20" fill="#64748b" font-size="10" font-weight="600">CASILLERO</text>
      <text x="117" y="44" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">08</text>

      <rect x="210" y="0" width="94" height="58" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="222" y="20" fill="#64748b" font-size="10" font-weight="600">BAHÍAS 4H</text>
      <text x="222" y="44" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">19</text>
    </g>

    <!-- Audit Log Rows -->
    <g transform="translate(18, 126)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
      <rect x="0" y="0" width="304" height="32" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="14" cy="16" r="3" fill="#34d399"/>
      <text x="25" y="20" fill="#cbd5e1">INGRESO • T2-402 • QR VALIDADO</text>

      <rect x="0" y="40" width="304" height="32" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="14" cy="56" r="3" fill="#38bdf8"/>
      <text x="25" y="60" fill="#cbd5e1">PAQUETE • T1-101 • PIN BCRYPT</text>

      <rect x="0" y="80" width="304" height="32" rx="7" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="14" cy="96" r="3" fill="#f59e0b"/>
      <text x="25" y="100" fill="#cbd5e1">RONDA QR • PERÍMETRO NORTE OK</text>
    </g>
  </g>
</svg>
