name: MinutaTech Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend-and-frontend:
    name: Backend Tests, Lint, UI Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minutatech-2026-256bit

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Run backend security, API & concurrency test suites
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend ESLint (zero errors / zero warnings)
        working-directory: frontend
        run: npx eslint . --max-warnings=0

      - name: Run frontend unit & UI component flow tests
        working-directory: frontend
        run: npm test

      - name: Build production Vite bundle
        working-directory: frontend
        run: npm run build
