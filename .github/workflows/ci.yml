name: MinutaTech Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-backend-and-frontend:
    name: Backend Tests, Lint, UI Tests & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret-minutatech-2026-256bit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run backend security, API & concurrency test suites
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend ESLint (zero errors / zero warnings)
        working-directory: frontend
        run: npx eslint . --max-warnings=0

      - name: Run frontend unit & UI component flow tests
        working-directory: frontend
        run: npm test

      - name: Build production Vite bundle
        working-directory: frontend
        run: npm run build
