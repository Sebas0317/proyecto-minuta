name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test
      - run: node -e "require('./src/data/jsonStore')"
      - run: node -e "require('./src/utils/idGenerator')"
      - run: node -e "require('./src/utils/pinGenerator')"

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  semgrep:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - run: semgrep --config=auto . --exclude="oi_env|node_modules|.opencode|dist|ai|scripts|backend/*.json.tmp|backend/users.json|docs/reports" --skip-unknown-extensions --metrics=off || true

  knip:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dead code check (Frontend)
        working-directory: frontend
        run: |
          npm install -g knip
          knip --no-gitignore || true
      - name: Dead code check (Backend)
        working-directory: backend
        run: |
          knip --no-gitignore || true

  ai-review:
    name: AI Code Review Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx ai-review-pipeline --branch main --lang es || true

